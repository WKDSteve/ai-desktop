# The checks of every push to main (and of a manual run): the same build the release makes, then the tests.
#
#   windows   scripts/setup.ps1 (MSYS2 / MinGW-w64): vendors the two header-only dependencies, builds, installs
#             into a throw-away prefix and smoke-tests the installed copy against GET /health; then the unit
#             tests (ctest) and the API tests (Node), which start the real binary on a free port.
#   hygiene   no control or invisible character in a tracked text file (tools/check-control-chars.py), the
#             release-kit actions of the other workflows are the pinned commit (tools/check-release-kit-pin.py),
#             the dashboard stays within its size budget (tools/check-dashboard-size.py),
#             and PSScriptAnalyzer finds nothing of severity Error or Warning in scripts/ and installer/; no job on
#             this runner installs the app (tools/check-install-runners.py).
#   defender  Microsoft Defender of this machine does not report the install line of the README (see the job).
#
# Every job runs on the self-hosted Windows runner of the author, by choice. That is why there is no Linux job;
# scripts/setup.sh stays for people who build from source there. There is no pull_request trigger: a pull request
# from a fork must never run its code on that runner. Pull requests run in pr.yml on GitHub-hosted runners.
#
# The rolling build (rolling.yml) starts after a green run of this workflow on main, so what it publishes
# has passed all of it. Actions are pinned by commit, the tag is in the comment; a job gets only the rights
# it needs and no credentials stay in a checkout.

name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  windows:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false

      # A dedicated MSYS2/MinGW-w64 toolchain: the runner image already has several g++ on PATH (Strawberry
      # Perl, C:\mingw64), none with OpenSSL. setup.ps1 is pointed at this one with -Msys2Root, which wins
      # over PATH.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-openssl

      - name: build, install and smoke-test with scripts/setup.ps1
        shell: pwsh
        run: |
          .\scripts\setup.ps1 `
            -Msys2Root '${{ steps.msys2.outputs.msys2-location }}' `
            -Prefix "$env:RUNNER_TEMP\stage" `
            -BuildType Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The binary needs the runtime DLLs of the toolchain, which the install step copies beside the
      # installed copy but not beside build/ai-desktop.exe.
      - name: unit tests (ctest)
        shell: pwsh
        run: |
          $env:PATH = '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;' + $env:PATH
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: API tests (Node, the real binary)
        shell: pwsh
        run: |
          $env:PATH = '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;' + $env:PATH
          node --version
          $tests = Get-ChildItem tests -Filter '*.test.mjs' | ForEach-Object { $_.FullName }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The dashboard in the system's Chrome against the same binary (e2e/a11y.spec.mjs): axe in light and dark,
      # with the decision banner, a hover and a focus, so the colours of the palette keep their contrast.
      - name: Dashboard in the browser (Playwright, axe)
        shell: pwsh
        working-directory: e2e
        run: |
          $env:PATH = '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;' + $env:PATH
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  hygiene:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # A control or invisible character in a tracked text file (a backspace in a path, a bidirectional
      # override in source) is refused; the tool tests itself.
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/check-control-chars.py
      # Every colour of the dashboard comes from dashboard/palette.css, the palette of ai's icon (generated by the
      # app icons tool, never edited here); a colour written in another stylesheet is refused.
      - run: python tools/check-color-literals.py --root dashboard --tokens dashboard/palette.css
      # The dashboard has no build step and the server sends its files as they are: its size (bytes, and gzipped) stays
      # within the budget of tools/check-dashboard-size.py, which a change that needs more raises on purpose.
      - run: python tools/check-dashboard-size.py
      # The release-kit actions of rolling.yml and release.yml are the commit of tools/release-kit.pin, and
      # that tag still names it (git ls-remote of appkit).
      - run: python tools/check-release-kit-pin.py
      # This runner is the author's machine, with ai-desktop installed for real: a job here that runs the setup or the
      # install script installs over that copy, and its uninstall takes it away (rolling.yml did, until 2026-11-16).
      - run: python tools/check-install-runners.py
      # The PowerShell scripts (setup, build-install, uninstall, the installer check) against PSScriptAnalyzer,
      # one pinned version so the rule set does not move under the scripts. Suppressions are local to a function
      # or a script and carry their reason; there is no settings file that hides a rule for everything.
      - name: PSScriptAnalyzer on the scripts
        shell: pwsh
        run: |
          # Installed only when the pinned version cannot be loaded: the runners of this machine share the user's module
          # folder, and an `Install-Module -Force` in every run wrote the module again while a job of another runner used
          # it ("currently in use", then a file of the module is missing and the step is red; testing-desktop, run
          # 43650895614). The import is the test, not the listing: a copy with a file missing is still listed, and it is
          # written again here. By version: autoloading would take the newest copy on the runner, not the pinned one.
          try {
            Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -ErrorAction Stop
          } catch {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
            Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -ErrorAction Stop
          }
          (Get-Module PSScriptAnalyzer).Version
          $found = @()
          foreach ($dir in 'scripts', 'installer') {
            $found += @(Invoke-ScriptAnalyzer -Path $dir -Recurse -Severity Error, Warning)
          }
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }

  # Microsoft Defender reported the install line, wrapped in a new powershell.exe with the execution policy switched
  # off, as Trojan:Win32/Commando.B!ml on 2026-11-14: a verdict of its cloud model, which changes with its signatures.
  # The GitHub-hosted VMs run without real-time protection, so only this machine can tell whether the line as the README
  # gives it is reported (again). The line is handed to Windows PowerShell 5.1 on its standard input, as a person types
  # it into a session, and install.ps1 stops before it downloads anything: PROCESSOR_ARCHITECTURE=ARM64 makes it say
  # "no build for Windows on ARM64". Nothing is installed here (tools/check-install-runners.py holds every job on this
  # runner to that). Red when Defender reports the line; the protection history of this machine then has the entry.
  defender:
    runs-on: [self-hosted, windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - name: Microsoft Defender does not report the install line of the README
        shell: pwsh
        env:
          PROCESSOR_ARCHITECTURE: ARM64
          LINE: irm https://github.com/${{ github.repository }}/releases/download/latest/install.ps1 | iex
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -LiteralPath README.md -SimpleMatch -Pattern $env:LINE -Quiet)) { throw "README.md does not name the line: $env:LINE" }
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.RealTimeProtectionEnabled) {
            Write-Host "::warning title=Defender not checked::Microsoft Defender does not run on this machine (AMServiceEnabled=$($status.AMServiceEnabled) RealTimeProtectionEnabled=$($status.RealTimeProtectionEnabled))"
            exit 0
          }
          $since = [DateTime]::UtcNow.Ticks
          # Typed into a session: the line arrives on the standard input of Windows PowerShell 5.1, so no command line holds it.
          $ps = Join-Path $env:windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $out = ($env:LINE | & $ps -NoProfile -NonInteractive -Command - 2>&1 | Out-String)
          Write-Host $out.TrimEnd()
          if ($out -notmatch 'no build for Windows on ARM64') { throw 'install.ps1 did not run as far as its architecture check (see above)' }
          Start-Sleep -Seconds 20   # Defender writes its entry after the verdict of its cloud model
          $found = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              $_.InitialDetectionTime.ToUniversalTime().Ticks -ge $since -and ($_.Resources -join ' ') -match 'install\.ps1|releases/download|powershell'
            })
          foreach ($d in $found) { Write-Host "::error title=Defender detection::$($d.InitialDetectionTime) threat $($d.ThreatID): $($d.Resources -join ' ')" }
          if ($found.Count -gt 0) { throw "Microsoft Defender reported the install line ($($found.Count) detection(s)); see the protection history" }
          Write-Host "Microsoft Defender (signatures $($status.AntivirusSignatureVersion)) reported nothing about the install line"
          # The script's own failure ("no build for Windows on ARM64") left a non-zero exit code of powershell.exe.
          exit 0
