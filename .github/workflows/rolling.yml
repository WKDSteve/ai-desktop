# The rolling build: after every green CI run on main, the Windows installer of exactly that commit is built,
# proven (installed, started, uninstalled, see .github/actions/installer-verify) and put on the pre-release
# `latest`, whose files are replaced each time. It is for trying the newest state with a click, not a release:
# no version tag, not signed. A release stays a deliberate act (release.yml, a pushed tag, a draft a person
# opens).
#
#   ai-desktop-setup-x64.exe     the installer, under a fixed name (the version inside is 0.0.<run number>)
#   install.ps1              installs exactly this build for the current user (release-kit of appkit,
#                            stamped for the channel `latest`)
#   SHA256SUMS               the checksums of both
#
# There is no install.sh and no Linux file: ai-desktop is built from source there (scripts/setup.sh).
#
# Builds and publishes on the self-hosted Windows runner of the author by choice: the jobs need the MSYS2 toolchain
# and the installer tooling set up there. Whatever installs the app (`verify`, `published`) runs on a throw-away
# GitHub-hosted VM instead: on the author's machine the silent setup would replace, and its uninstall remove, the
# ai-desktop installed there (2026-11-14: `published` failed with exit code 5 because that one was running).
# The release-kit actions run on the self-hosted runner by Git Bash (appkit v0.23.1 and later);
# appkit is cloned over plain HTTPS without a token secret (anonymous once appkit is public; until then
# Git's credential helper on the runner answers, and tools/check-release-kit-pin.py needs it the same way).
#
# Deciding (the newest green commit of main is built) and publishing (SHA256SUMS first, the words of the page last) are
# the actions prepare and publish of appkit's release-kit, pinned by the commit of tools/release-kit.pin
# (tools/check-release-kit-pin.py checks that they agree). The build is ours: its file goes to publish as an
# artifact. Actions are pinned by commit; a job gets only the rights it needs.

name: rolling

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: A green commit of main to build again (full id); empty - the newest green commit
        required: false

# One group and nothing cancelled: `prepare` decides at the start of each run which commit is the newest green one
# of main and whether it is newer than the build that is up (`latest` only moves forward), so an older run
# neither replaces nor cancels a newer build, and a waiting run is replaced by a newer one of the same group.
concurrency:
  group: rolling
  cancel-in-progress: false

permissions:
  contents: read

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  prepare:
    # Only a green run that came from a push to main (not a pull request).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      current: ${{ steps.prepare.outputs.current }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - id: prepare
        uses: WKDSteve/appkit/release-kit/prepare@6d1f998a13aa5fcb9b436a06d57c15958792b919 # v0.84.0
        with:
          sha: ${{ github.event.inputs.sha }}
          channels: latest
          token: ${{ github.token }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.current == 'true' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/installer-build
        id: installer
        with:
          version: 0.0.${{ github.run_number }}

      - name: Name the installer
        env:
          FILE: ${{ steps.installer.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$FILE" out/ai-desktop-setup-x64.exe
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolling-windows
          path: out/ai-desktop-setup-x64.exe
          if-no-files-found: error
          retention-days: 1

  # The installer is installed, started, updated and uninstalled through the install script of the pinned
  # release-kit, on a throw-away VM (.github/actions/installer-verify says why not here). Nothing is offered before.
  verify:
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rolling-windows
          path: out
      - uses: ./.github/actions/installer-verify
        with:
          folder: out

  # The file, the stamped install script and the checksums go up in one job; the words of the page move last,
  # so only then does it name this commit.
  publish:
    needs: [prepare, build, verify]
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write        # the attestation of the files (appkit release-kit, see its README)
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rolling-*
          path: dist
          merge-multiple: true
      - uses: WKDSteve/appkit/release-kit/publish@6d1f998a13aa5fcb9b436a06d57c15958792b919 # v0.84.0
        with:
          token: ${{ github.token }}
          tag: latest
          sha: ${{ needs.prepare.outputs.sha }}
          files: dist
          expect: 1
          app: ai-desktop
          windows-kind: inno
          windows-release-asset: ai-desktop-setup-{version}-x64.exe
          windows-rolling-asset: ai-desktop-setup-x64.exe
          notes-file: .github/rolling-notes.md

  # What a person does, on what was just published: the install line of the README and of the page, run as it is
  # typed into Windows PowerShell 5.1 (`irm ... | iex`, no GitHub token, so the plain download), then the
  # installed server must answer /health and the uninstaller must take it away. URL, channel, asset name,
  # SHA256SUMS, the stamp and the silent setup are all the published ones. The build job's check used the
  # unstamped script of the same kit; this proves the stamp, the published files and the line itself.
  #
  # On a throw-away VM: on the self-hosted runner the setup would install over the ai-desktop of the author's
  # machine and then uninstall it. The VM is elevated, and the line takes no -AllowElevated:
  # INSTALL_ALLOW_ELEVATED=1 says the same to install.ps1 (appkit release-kit, v0.61.0 and later).
  published:
    needs: [prepare, publish]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      LINE: irm https://github.com/${{ github.repository }}/releases/download/latest/install.ps1 | iex
    steps:
      - name: The page of latest names the line that is run here
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = gh release view latest --repo $env:REPO --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed ($LASTEXITCODE)" }
          $lines = @(($body -join "`n") -split "`r?`n" | ForEach-Object { $_.Trim() })
          if ($lines -cnotcontains $env:LINE) { throw "the page of latest does not name the line: $env:LINE" }
          Write-Host "the page names: $env:LINE"

      # Invoke-Expression of the line is the line typed into the session. No GH_TOKEN here: a person has none, and
      # with one install.ps1 would take the API route. gh, without a token, cannot check the attestation;
      # install.ps1 only notes that, and gh's exit code stays in $LASTEXITCODE, which the shell of the step would
      # return as the step's own: the step therefore ends with its own `exit 0`.
      - name: Install with the line as it is typed, start, ask /health, uninstall
        id: install
        env:
          INSTALL_ALLOW_ELEVATED: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          "STARTED_TICKS=$([DateTime]::UtcNow.Ticks)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Invoke-Expression $env:LINE
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ai-desktop'
          if (-not (Test-Path (Join-Path $dir 'app\ai-desktop.exe'))) { throw "no app\ai-desktop.exe in $dir" }
          $server = Start-Process -FilePath (Join-Path $dir 'app\ai-desktop.exe') -WorkingDirectory (Join-Path $dir 'app') -PassThru -WindowStyle Hidden
          try {
            $health = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            while ([DateTime]::UtcNow -lt $deadline -and -not $health) {
              Start-Sleep -Milliseconds 500
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/health' -TimeoutSec 2 } catch { }
            }
            if (-not $health -or $health.status -ne 'ready') { throw 'the installed server did not answer /health within 20 s' }
            Write-Host "/health: status=$($health.status)"
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
          $uninstaller = Join-Path $dir 'unins000.exe'
          Start-Process -FilePath $uninstaller -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          while ((Test-Path (Join-Path $dir 'app')) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Join-Path $dir 'app')) { throw 'the uninstaller left the app directory behind' }
          exit 0

      # Microsoft Defender reported the line in its wrapped form as a trojan (2026-11-14), a verdict of its cloud
      # model that can change. Where Defender runs on the VM, any detection since the install began turns the job
      # red, also when the install itself failed (a detection may be why). Where it does not run, that is said.
      - name: Microsoft Defender reported nothing
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $status = $null
          try { $status = Get-MpComputerStatus } catch { Write-Host "Get-MpComputerStatus: $_" }
          if (-not $status -or -not $status.AMServiceEnabled -or -not $status.RealTimeProtectionEnabled) {
            $state = if ($status) { "AMServiceEnabled=$($status.AMServiceEnabled) RealTimeProtectionEnabled=$($status.RealTimeProtectionEnabled)" } else { 'no status' }
            Write-Host "::notice title=Defender not checked::Microsoft Defender does not run on this VM ($state): whether it reports the line is not known from this run."
            exit 0
          }
          $since = [long]$env:STARTED_TICKS
          $found = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
            Where-Object { $_.InitialDetectionTime.ToUniversalTime().Ticks -ge $since })
          foreach ($d in $found) {
            Write-Host "::error title=Defender detection::$($d.InitialDetectionTime) threat $($d.ThreatID): $($d.Resources -join ' ')"
          }
          if ($found.Count -gt 0) { throw "Microsoft Defender reported $($found.Count) detection(s) during the install" }
          Write-Host "Microsoft Defender runs (signatures $($status.AntivirusSignatureVersion)) and reported nothing since the install began"
