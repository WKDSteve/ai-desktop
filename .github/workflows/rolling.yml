# The rolling build: after every green CI run on main, the Windows installer of exactly that commit is built,
# proven (installed, started, uninstalled, see .github/actions/installer-build) and put on the pre-release
# `latest`, whose files are replaced each time. It is for trying the newest state with a click, not a release:
# no version tag, not signed. A release stays a deliberate act (release.yml, a pushed tag, a draft a person
# opens).
#
#   ai-desktop-setup-x64.exe     the installer, under a fixed name (the version inside is 0.0.<run number>)
#   install.ps1              installs exactly this build for the current user (release-kit of appkit,
#                            stamped for the channel `latest`)
#   SHA256SUMS               the checksums of both
#
# There is no install.sh and no Linux file: ai-desktop is built from source there (scripts/setup.sh).
#
# Runs on the self-hosted Windows runner of the author by choice: the jobs need the MSYS2 toolchain and the
# installer tooling set up there. The release-kit actions run there by Git Bash (appkit v0.23.1 and later);
# appkit is cloned over plain HTTPS, no token secret.
#
# Deciding (only the tip of main is built) and publishing (SHA256SUMS first, the words of the page last) are
# the actions prepare and publish of appkit's release-kit, pinned by the commit of tools/release-kit.pin
# (tools/check-release-kit-pin.py checks that they agree). The build is ours: its file goes to publish as an
# artifact. Actions are pinned by commit; a job gets only the rights it needs.

name: rolling

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Only the run of the TIP of main may build, and a newer tip replaces a build that is still running: the
# pre-release must end on the newest commit. For a `workflow_run` event `github.sha` is the tip of main when
# the run started and `head_sha` is the commit the CI run was about, so a CI run of an OLDER commit that
# finishes late lands in a group of its own (it builds nothing, `prepare` says so) and can neither cancel the
# build of the tip nor push the waiting build of the tip out of the queue.
concurrency:
  group: rolling-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  prepare:
    # Only a green run that came from a push to main (not a pull request).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      current: ${{ steps.prepare.outputs.current }}
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - id: prepare
        uses: WKDSteve/appkit/release-kit/prepare@cac769a78b71d39357df193e5c7bd3c8f0450ddb # v0.25.1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.current == 'true' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      # The install script the installer is tried through is the one that will be stamped and attached: the
      # release-kit at the commit of tools/release-kit.pin, cloned over plain HTTPS (no token secret).
      - name: Fetch the pinned release-kit
        run: |
          commit="$(sed -n 's/^commit *= *//p' tools/release-kit.pin)"
          rm -rf .kit
          git clone --quiet https://github.com/WKDSteve/appkit .kit
          git -C .kit checkout --quiet "$commit"

      - uses: ./.github/actions/installer-build
        id: installer
        with:
          version: 0.0.${{ github.run_number }}
          install-script: .kit/release-kit/scripts/install.ps1

      - name: Name the installer
        env:
          FILE: ${{ steps.installer.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$FILE" out/ai-desktop-setup-x64.exe
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolling-windows
          path: out/ai-desktop-setup-x64.exe
          if-no-files-found: error
          retention-days: 1

  # The file, the stamped install script and the checksums go up in one job; the words of the page move last,
  # so only then does it name this commit.
  publish:
    needs: [prepare, build]
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rolling-*
          path: dist
          merge-multiple: true
      - uses: WKDSteve/appkit/release-kit/publish@cac769a78b71d39357df193e5c7bd3c8f0450ddb # v0.25.1
        with:
          token: ${{ github.token }}
          tag: latest
          sha: ${{ needs.prepare.outputs.sha }}
          files: dist
          expect: 1
          app: ai-desktop
          windows-kind: inno
          windows-release-asset: ai-desktop-setup-{version}-x64.exe
          windows-rolling-asset: ai-desktop-setup-x64.exe
          notes-file: .github/rolling-notes.md

  # What a user does, on what was just published: the stamped install.ps1 of `latest` is fetched from GitHub
  # the way `irm | iex` does it, with the one difference that the runner is elevated (hence -AllowElevated, which
  # the one-liner cannot pass), and it installs for real: URL, channel, asset name, SHA256SUMS and the silent
  # setup. The installed server must answer /health; then the setup is taken away again. The build job proved
  # the installer with the unstamped script of the same kit; this proves the stamp and the published files.
  published:
    needs: [prepare, publish]
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      # Windows PowerShell 5.1, the one a person has by default: the token route of install.ps1 (GH_TOKEN)
      # went wrong there until release-kit v0.23.2 ("maximum number of redirections": `Invoke-WebRequest
      # -MaximumRedirection 0` throws without a response in 5.1). This step is the test that it stays right.
      - name: Install from latest, start, ask /health, uninstall
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # A 5.1 started from the runner finds no Get-FileHash without its own module path.
          PSModulePath: C:\Program Files\WindowsPowerShell\Modules;C:\Windows\system32\WindowsPowerShell\v1.0\Modules
        run: |
          $ErrorActionPreference = 'Stop'
          # The script comes through the API with the token of the run, and install.ps1 reads the same
          # token from GH_TOKEN for its own downloads: this keeps the token route tested, which a private
          # repository needs.
          $dir0 = Join-Path $env:RUNNER_TEMP 'published'
          New-Item -ItemType Directory -Force -Path $dir0 | Out-Null
          gh release download latest --repo $env:REPO --pattern install.ps1 --dir $dir0 --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)" }
          $text = Get-Content -Raw -Encoding UTF8 -Path (Join-Path $dir0 'install.ps1')
          & ([scriptblock]::Create($text)) -AllowElevated
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ai-desktop'
          if (-not (Test-Path (Join-Path $dir 'app\ai-desktop.exe'))) { throw "no app\ai-desktop.exe in $dir" }
          $server = Start-Process -FilePath (Join-Path $dir 'app\ai-desktop.exe') -WorkingDirectory (Join-Path $dir 'app') -PassThru -WindowStyle Hidden
          try {
            $health = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            while ([DateTime]::UtcNow -lt $deadline -and -not $health) {
              Start-Sleep -Milliseconds 500
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/health' -TimeoutSec 2 } catch { }
            }
            if (-not $health -or $health.status -ne 'ready') { throw 'the installed server did not answer /health within 20 s' }
            Write-Host "/health: status=$($health.status)"
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
          $uninstaller = Join-Path $dir 'unins000.exe'
          Start-Process -FilePath $uninstaller -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          while ((Test-Path (Join-Path $dir 'app')) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path (Join-Path $dir 'app')) { throw 'the uninstaller left the app directory behind' }
