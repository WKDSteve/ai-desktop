# Build the Windows installer of ai-desktop, for release.yml and rolling.yml alike (so the two cannot drift apart):
# scripts/setup.ps1 builds and stages the app and smoke tests it, and Inno Setup packs that stage.
#
# Nothing is installed here: this runs on the self-hosted runner, which is the maintainer's machine. The installer
# is proven by .github/actions/installer-verify in a job of its own on a throw-away VM (see there why).
#
# Output `file`: the installer, dist/ai-desktop-setup-<version>-x64.exe. The caller names it and uploads it.
#
# A dedicated MSYS2/MinGW-w64 toolchain: the runner image already has several g++ on PATH (Strawberry Perl,
# C:\mingw64), none with OpenSSL. setup.ps1 is pointed at this one with -Msys2Root, which wins over PATH.

name: build the installer
description: Build ai-desktop-setup-<version>-x64.exe with MSYS2 and Inno Setup.

inputs:
  version:
    description: The version of the installer, numeric (X.Y.Z); Inno Setup needs a number.
    required: true

outputs:
  file:
    description: The installer, relative to the workspace.
    value: ${{ steps.pack.outputs.file }}

runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      id: msys2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-openssl

    # The same script a developer runs by hand: checks, vendors the pinned headers, builds, installs into a
    # staging prefix, smoke-tests it.
    - name: build and stage with scripts/setup.ps1
      shell: pwsh
      env:
        MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        .\scripts\setup.ps1 -Msys2Root $env:MSYS2_ROOT -Prefix "$env:RUNNER_TEMP\stage" -BuildType Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: make sure Inno Setup is installed
      shell: pwsh
      run: |
        # A hosted runner has it (or Chocolatey); a self-hosted one has the per-user install of
        # `winget install JRSoftware.InnoSetup --scope user`.
        $candidates = @(
          (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
          (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
          (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
        )
        $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc -and (Get-Command choco -ErrorAction SilentlyContinue)) {
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        }
        if (-not $iscc) { throw "ISCC.exe not found (looked in: $($candidates -join '; '))" }
        "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: build the installer
      id: pack
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "the version '$env:VERSION' is not numeric X.Y.Z" }
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        & $env:ISCC /Q "/DAppVersion=$env:VERSION" "/DStageDir=$env:RUNNER_TEMP\stage" "/O$PWD\dist" installer\ai-desktop.iss
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
        $setup = Get-Item "dist\ai-desktop-setup-$env:VERSION-x64.exe"
        Get-ChildItem dist | Format-Table Name, Length
        "file=dist/$($setup.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

