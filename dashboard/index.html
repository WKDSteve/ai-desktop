<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 64 64%22%3E%3Crect width%3D%2264%22 height%3D%2264%22 rx%3D%2212%22 fill%3D%22%231B1B1A%22%2F%3E%3Cpath d%3D%22M0 12A12 12 0 0 1 12 0H52A12 12 0 0 1 64 12V18H0Z%22 fill%3D%22%231F5FBF%22%2F%3E%3Crect x%3D%228%22 y%3D%225%22 width%3D%2248%22 height%3D%228%22 rx%3D%224%22 fill%3D%22%23fff%22 fill-opacity%3D%220.9%22%2F%3E%3Ctext x%3D%2232%22 y%3D%2252%22 text-anchor%3D%22middle%22 font-family%3D%22Consolas%2C 'Cascadia Mono'%2C Menlo%2C 'DejaVu Sans Mono'%2C monospace%22 font-size%3D%2230%22 font-weight%3D%22700%22 fill%3D%22%2385B7EB%22%3Eai%3C%2Ftext%3E%3C%2Fsvg%3E">
  <meta name="color-scheme" content="light dark">
  <!-- The colours of ai's icon (generated, never edited here), then the rules that use them. -->
  <link rel="stylesheet" href="palette.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="row">
    <img id="app-icon" alt="" width="20" height="20">
    <h1 id="app-title">▸ ai Dashboard</h1>
  </div>
  <div class="row">
    <span id="sse-dot" class="dot"></span>
    <span id="sse-label" class="small muted" data-i18n="connecting"></span>
  </div>
</header>

<main>
<!-- Shown when the server wants a login: the page was opened without a ticket, or the server started anew. -->
<div id="login-banner" role="alert" hidden>
  <h2 data-i18n="login_title"></h2>
  <p data-i18n="login_hint"></p>
</div>
<!-- Decision Banner (Hard Stop) -->
<div id="decision-banner">
  <h2 data-i18n="decision_title"></h2>
  <div id="decision-text"></div>
  <div class="actions">
    <button class="btn btn-green" data-on-click="sendDecision" data-arg="allow" data-i18n="allow"></button>
    <button class="btn btn-red" data-on-click="sendDecision" data-arg="deny" data-i18n="deny"></button>
  </div>
</div>

<div class="grid">
  <!-- Agents -->
  <div class="card">
    <h2 data-i18n="agents"></h2>
    <div class="agent">
      <div class="dot" id="dot-Planner"></div>
      <div>
        <div class="agent-name" data-i18n="agent_planner"></div>
        <div class="agent-msg" id="msg-Planner">—</div>
      </div>
    </div>
    <div class="agent">
      <div class="dot" id="dot-Executor"></div>
      <div>
        <div class="agent-name" data-i18n="agent_executor"></div>
        <div class="agent-msg" id="msg-Executor">—</div>
      </div>
    </div>
    <div class="agent">
      <div class="dot" id="dot-human"></div>
      <div>
        <div class="agent-name" data-i18n="agent_human"></div>
        <div class="agent-msg" id="msg-human" data-i18n="ready"></div>
      </div>
    </div>
  </div>

  <!-- System -->
  <div class="card">
    <h2>System</h2>
    <!-- Only what the page checks; a badge turns green when its check passed (app.js). -->
    <div class="status-row">
      <span class="badge badge-idle" id="sse-badge" translate="no">SSE</span>
      <span id="sse-status" class="muted" data-i18n="connecting"></span>
    </div>
    <div class="status-row">
      <span class="badge badge-idle" id="backends-badge" translate="no">Backends</span>
      <span id="backends-status" class="muted" data-i18n="loading"></span>
    </div>
    <!-- A backend whose model listing failed (a rejected key, Ollama down): the reason, one line each (app.js). -->
    <div id="backends-errors" class="backend-errors" role="status" hidden></div>
  </div>
</div>

<!-- Jobs: tasks the apps of the family handed over (POST /jobs, docs/JOBS.md). A prefilled job waits here with its text;
     nothing runs before Run, and a private area goes to a cloud model only after the question below. -->
<div class="card" id="jobs-card">
  <h2 data-i18n="jobs"></h2>
  <p id="jobs-empty" class="small muted" data-i18n="jobs_empty"></p>
  <ul id="jobs-list" data-i18n-aria-label="jobs"></ul>
  <div id="job-detail" hidden>
    <div id="job-meta" class="small muted"></div>
    <textarea id="job-markdown" data-i18n-aria-label="job_text"></textarea>
    <div class="ask-row">
      <input id="job-model" data-i18n-aria-label="job_model" list="ask-model-presets">
      <button class="btn btn-teal" id="job-run" data-on-click="runJob" data-i18n="run"></button>
      <button class="btn btn-muted" id="job-stop" data-on-click="stopJob" disabled data-i18n="stop"></button>
      <button class="btn btn-muted" id="job-dismiss" data-on-click="dismissJob" data-i18n="dismiss"></button>
    </div>
    <!-- How the run runs: Claude Code with the brief of the tasks family (and its versions), or one answer. -->
    <p id="job-runner" class="small muted"></p>
    <div id="job-confirm" hidden>
      <p id="job-confirm-text" class="small"></p>
      <div class="actions">
        <button class="btn btn-muted" id="job-confirm-send" data-on-click="confirmJob" data-i18n="job_send_anyway"></button>
      </div>
    </div>
    <div id="job-status" role="status"></div>
    <div id="job-output"></div>
  </div>
  <details id="job-settings">
    <summary data-i18n="job_settings"></summary>
    <label class="row small"><input type="checkbox" id="jobs-enabled" data-on-change="saveJobSettings" data-arg="jobs">
      <span data-i18n="jobs_accept"></span></label>
    <label class="row small"><span data-i18n="private_areas"></span>
      <input id="private-areas" data-on-change="saveJobSettings" data-arg="private_areas" data-i18n-placeholder="private_areas_placeholder"></label>
    <p id="job-settings-status" class="small muted"></p>
  </details>
</div>

<!-- Ask panel: try /ask/stream against every ModelRouter backend by hand, without curl or ai.nvim. -->
<div class="card">
  <h2>Ask</h2>
  <textarea id="ask-prompt" aria-label="Prompt" data-i18n-placeholder="prompt_placeholder"></textarea>
  <div class="ask-row">
    <input id="ask-model" data-i18n-aria-label="model" list="ask-model-presets"
           data-i18n-placeholder="model_placeholder">
    <!-- Filled from GET /models on the first focus of the field (app.js). -->
    <datalist id="ask-model-presets"></datalist>
    <button class="btn btn-teal" id="ask-send" data-on-click="sendAsk" data-i18n="send"></button>
    <button class="btn btn-muted" id="ask-stop" data-on-click="stopAsk" disabled data-i18n="stop"></button>
  </div>
  <div id="ask-hint"><span data-i18n="ask_hint_before"></span><code translate="no">gpt-</code>/<code translate="no">o1-</code>/<code translate="no">o3-</code>
    → <span translate="no">OpenAI</span>, <code translate="no">claude-</code> → <span translate="no">Anthropic</span>, <code translate="no">gemini-</code> → <span translate="no">Gemini</span><span data-i18n="ask_hint_after"></span></div>
  <!-- Filled with the errors of GET /models: the list then holds only the built-in suggestions of that backend. -->
  <div id="ask-model-errors" class="backend-errors" role="status" hidden></div>
  <div id="ask-status"></div>
  <div id="ask-output"></div>
</div>

<!-- Usage: GET /usage (metadata from usage.jsonl, never the text of a prompt or an answer), by provider and period. -->
<div class="card">
  <h2 data-i18n="usage"></h2>
  <div class="usage-filters">
    <!-- An x in the field takes the choice back in one click (as the choices of the other desktop apps,
         appkit-ui ClearSelect); without a choice there is no x. -->
    <span class="clear-select">
      <select id="usage-provider" aria-label="Provider" data-on-change="providerChanged">
        <option value="" data-i18n="all_providers"></option>
      </select>
      <button type="button" id="usage-provider-clear" class="clear" data-i18n-aria-label="clear_provider"
              data-i18n-title="clear_provider" hidden
              data-keep-focus data-on-click="clearProvider"><span aria-hidden="true">×</span></button>
    </span>
    <select id="usage-range" data-i18n-aria-label="range" data-on-change="loadUsage">
      <option value="24h" data-i18n="range_24h"></option>
      <option value="7d" selected data-i18n="range_7d"></option>
      <option value="30d" data-i18n="range_30d"></option>
      <option value="all" data-i18n="range_all"></option>
    </select>
    <button class="btn btn-muted" data-on-click="loadUsage" data-i18n="refresh"></button>
  </div>
  <div class="usage-kpis">
    <div class="kpi">
      <div class="kpi-label" data-i18n="requests"></div>
      <div class="kpi-value" id="usage-requests">—</div>
      <div class="kpi-sub" id="usage-requests-sub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label" data-i18n="prompt_tokens"></div>
      <div class="kpi-value" id="usage-prompt-tokens">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label" data-i18n="completion_tokens"></div>
      <div class="kpi-value" id="usage-completion-tokens">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label" data-i18n="cost_usd"></div>
      <div class="kpi-value" id="usage-cost">—</div>
      <div class="kpi-sub" id="usage-cost-sub"></div>
    </div>
  </div>
  <table class="usage-table">
    <thead>
      <tr>
        <th>Provider</th>
        <th class="num" data-i18n="requests"></th>
        <th class="num" data-i18n="prompt_tokens"></th>
        <th class="num" data-i18n="completion_tokens"></th>
        <th class="num" data-i18n="cost_usd"></th>
      </tr>
    </thead>
    <tbody id="usage-by-provider"></tbody>
  </table>
  <h2 data-i18n="recent_events"></h2>
  <div id="usage-events"></div>
  <div id="usage-status"></div>
</div>

<!-- Live-Log -->
<div class="card">
  <h2 data-i18n="live_log"></h2>
  <div id="log"></div>
</div>
</main>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
